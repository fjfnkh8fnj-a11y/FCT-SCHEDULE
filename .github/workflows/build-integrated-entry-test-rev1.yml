name: Build integrated entry test rev1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_integrated_entry_test_rev1.py'
      - '.github/workflows/build-integrated-entry-test-rev1.yml'

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test page
        run: python scripts/build_integrated_entry_test_rev1.py
      - name: Check inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('FCT-SCHEDULE_INTEGRATED-ENTRY_TEST_rev.1.html','utf8');
          const start=h.indexOf('<script>');
          const end=h.lastIndexOf('</script>');
          if(start<0||end<0||end<=start) throw new Error('inline script not found');
          new Function(h.slice(start+8,end));
          const required=['연동등록 TEST','name="showOverall" checked','name="showDept" checked',"TEST · 서버 저장 안 함","INTEGRATED TEST rev.1"];
          for(const x of required) if(!h.includes(x)) throw new Error('missing '+x);
          console.log('syntax/static checks ok');
          NODE
      - name: Commit test page
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FCT-SCHEDULE_INTEGRATED-ENTRY_TEST_rev.1.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add integrated entry test preview rev.1'
          git push
