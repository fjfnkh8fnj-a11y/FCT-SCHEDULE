            <ul>
              <li>A가 일반 일정을 수정하는 동안 B가 방문업체를 등록해도 각각 별도로 저장됩니다.</li>
              <li>A가 일정 A를 수정하고 B가 일정 B를 수정하는 경우에도 서로 덮어쓰지 않습니다.</li>
