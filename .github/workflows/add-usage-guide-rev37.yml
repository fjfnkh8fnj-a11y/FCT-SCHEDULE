name: Add detailed usage guide rev37

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-index:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rev37 usage guide
        run: python scripts/add_usage_guide_rev37.py
      - name: Commit rev37
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html FCT_통합일정_rev.37.html
          git commit -m "Add detailed bottom usage guide rev.37"
          git push
