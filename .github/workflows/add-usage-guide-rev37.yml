name: Add detailed usage guide rev37

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bottom usage guide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="usageGuide"' in s:
              raise SystemExit(0)

          s = s.replace('rev.36', 'rev.37')

          css = r'''
          .usage-guide{margin-top:22px;padding:0;overflow:hidden}
          .usage-guide-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:24px 26px;background:linear-gradient(135deg,#102747,#173965);color:white}
          .usage-guide-head h2{margin:5px 0 8px;font-size:24px}.usage-guide-head p{margin:0;color:#d3dfec;line-height:1.6;font-size:14px}
          .guide-kicker{font-size:11px;font-weight:800;letter-spacing:.08em;color:#9fc3e8}.guide-version{flex-shrink:0;border:1px solid #6f91b4;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:800;color:#d9e8f6}
          .guide-content{padding:22px 24px 26px}.guide-notice{background:#eef6ff;border-left:4px solid #1766b1;border-radius:8px;padding:12px 14px;margin-bottom:16px;color:#264b70;font-size:13px;line-height:1.65}
          .guide-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:18px}.guide-quick div{border:1px solid #dce6ef;background:#f8fbfe;border-radius:10px;padding:12px}.guide-quick b{display:block;color:#173965;margin-bottom:4px}.guide-quick span{font-size:12px;color:#637187;line-height:1.45}
          .usage-guide details{border-top:1px solid #e3eaf1}.usage-guide details:last-child{border-bottom:1px solid #e3eaf1}.usage-guide summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:15px 4px;font-weight:800;color:#213d5b}.usage-guide summary::-webkit-details-marker{display:none}.usage-guide summary::after{content:'＋';margin-left:auto;color:#6b7e92;font-size:18px}.usage-guide details[open] summary::after{content:'−'}.guide-no{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:12px;background:#eaf2fb;color:#1766b1;font-size:11px}
          .guide-body{padding:0 4px 17px 44px;color:#52647a;font-size:13px;line-height:1.75}.guide-body p{margin:7px 0}.guide-body ul,.guide-body ol{margin:7px 0;padding-left:20px}.guide-body li{margin:4px 0}.guide-body strong{color:#203e5e}.guide-example{background:#f7f9fc;border:1px solid #e0e7ef;border-radius:8px;padding:10px 12px;margin:9px 0;color:#40566f}.guide-warning{color:#9b3b48;background:#fff5f6;border:1px solid #f0d1d6;border-radius:8px;padding:9px 11px;margin:9px 0}.guide-color-row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.guide-color{display:inline-flex;align-items:center;gap:6px}.guide-color i{width:14px;height:14px;border-radius:4px;border:1px solid #cbd6e1}
          @media(max-width:850px){.guide-quick{grid-template-columns:1fr 1fr}.usage-guide-head{padding:20px}.guide-content{padding:18px}}
          @media(max-width:600px){.usage-guide-head{display:block}.guide-version{display:inline-block;margin-top:12px}.guide-quick{grid-template-columns:1fr}.guide-body{padding-left:8px}.usage-guide summary{align-items:flex-start}.usage-guide-head h2{font-size:21px}}
          '''
          s = s.replace('</style>', css + '\n</style>', 1)

          guide = r'''
    <section class="usage-guide card" id="usageGuide" aria-labelledby="usageGuideTitle">
      <div class="usage-guide-head">
        <div>
          <span class="guide-kicker">처음 사용하시는 분을 위한 안내</span>
          <h2 id="usageGuideTitle">FCT 일정관리 사용방법</h2>
          <p>일정 등록부터 반복주기, 과거이력, 방문업체·유틸리티 작업, 다중 사용자 저장까지 실제 사용 순서대로 정리했습니다.</p>
        </div>
        <span class="guide-version">rev.37 기준</span>
      </div>
      <div class="guide-content">
        <div class="guide-notice"><strong>가장 중요한 저장 확인</strong><br>등록·수정·삭제 후 화면 하단 상태가 <strong>「개별 저장됨」</strong>으로 바뀐 것을 확인한 뒤 창을 닫아 주세요. 저장 중에는 「변경 항목 저장 중」으로 표시됩니다. 여러 명이 동시에 사용해도 서로 다른 항목은 각각 저장되며, 같은 항목을 동시에 수정했을 때만 충돌 안내가 표시됩니다.</div>
        <div class="guide-quick">
          <div><b>일반 일정</b><span>부서 일정, 교육, 점검, 측정, 법정주기 업무 등록</span></div>
          <div><b>반복 일정</b><span>주·개월·년 단위로 자동 생성하고 실제 실행일 기준으로 다음 일정 재계산</span></div>
          <div><b>출입·작업관리</b><span>방문업체와 유틸리티 작업을 별도로 등록·조회</span></div>
          <div><b>과거 이력</b><span>기존 실시일·교육일·점검일을 일정별로 누적 관리</span></div>
        </div>

        <details open>
          <summary><span class="guide-no">01</span>처음 접속하고 화면을 보는 방법</summary>
          <div class="guide-body">
            <ol>
              <li>FCT 일정관리 주소로 접속한 뒤 회사에서 공유된 <strong>공용 비밀번호</strong>를 입력합니다.</li>
              <li>접속되면 기본 화면은 <strong>전체 일정</strong>입니다. 전체 부서 일정과 방문·유틸리티 일정이 함께 표시됩니다.</li>
              <li>왼쪽 메뉴에서 <strong>연간일정 / 출입·작업관리 / 품질 / 박막 / 전반 / 가공 / 소성 / 경영지원</strong>을 선택할 수 있습니다.</li>
              <li>FCT 로고를 누르면 언제든 <strong>이번 달 전체 일정 첫 화면</strong>으로 돌아옵니다.</li>
              <li>달력의 이전·다음 화살표로 월을 이동하고, <strong>이번 달</strong> 버튼으로 현재 월로 복귀합니다.</li>
            </ol>
            <p>PC에서는 달력 칸에 일정 내용이 바로 보이고, 모바일에서는 달력 칸의 건수를 확인한 뒤 아래의 월 일정 목록·금주·차주 목록에서 상세 내용을 확인할 수 있습니다.</p>
          </div>
        </details>

        <details>
          <summary><span class="guide-no">02</span>일반 일정 등록 방법</summary>
          <div class="guide-body">
            <ol>
              <li>전체 일정 또는 부서 화면에서 우측 상단 <strong>＋ 일정 등록</strong>을 누릅니다.</li>
              <li><strong>담당 부서 / 날짜 / 일정명 / 내용</strong>은 필수입니다.</li>
              <li>시간이 필요한 일정만 시간과 종료시간을 「지정」으로 바꾸고 4자리 숫자로 입력합니다. 예: 09:30 → <strong>0930</strong>.</li>
              <li>한 번만 하는 일정은 반복주기를 지정하지 않습니다.</li>
              <li>등록 후 해당 월로 자동 이동하며 서버에 개별 저장됩니다.</li>
            </ol>
            <div class="guide-example"><strong>예시</strong> · 담당부서: 경영지원 / 날짜: 2026-10-20 / 일정명: 안전보건관리책임자 교육 / 내용: 제조업 111기 집체교육</div>
          </div>
        </details>

        <details>
          <summary><span class="guide-no">03</span>반복주기와 자동 생성 일정 사용 방법</summary>
          <div class="guide-body">
            <p>반복되는 법정업무·점검·교육은 일정 등록 시 <strong>반복주기 → 지정</strong>을 선택합니다.</p>
            <ul>
              <li>반기 1회: <strong>6 + 개월마다</strong></li>
              <li>매년: <strong>1 + 년마다</strong></li>
              <li>2년마다: <strong>2 + 년마다</strong></li>
              <li>매주: <strong>1 + 주마다</strong></li>
            </ul>
            <p>기준 일정을 한 번 등록하면 이후 회차는 달력에 <strong>자동</strong> 표시와 파란 점선으로 구분됩니다.</p>
            <p>자동 생성된 회차를 누르면 <strong>주기 예정일 / 실행날짜 / 다음 자동 일정</strong>을 확인할 수 있습니다.</p>
            <p><strong>실행날짜 수정</strong>에서 실제 실시일을 바꾸면 이후 일정도 그 실행일을 새로운 기준으로 자동 재계산합니다.</p>
            <div class="guide-example">예: 2년 주기 2028-10-20 예정 → 실제 실행일을 2028-10-24로 변경 → 다음 일정은 자동으로 <strong>2030-10-24</strong>가 됩니다.</div>
            <p>「원래 날짜로 복원」을 누르면 해당 회차를 원래 주기 흐름으로 돌리고 이후 일정도 다시 계산합니다.</p>
          </div>
        </details>

        <details>
          <summary><span class="guide-no">04</span>과거 실시 이력 확인·등록·수정 방법</summary>
          <div class="guide-body">
            <p>대기 자가측정, 작업환경측정, 관리책임자 교육처럼 과거 실시일을 함께 관리해야 하는 일정은 <strong>달력의 일정명을 누릅니다.</strong></p>
            <ol>
              <li>일정 상세 화면 아래의 <strong>과거 이력</strong>에서 기존 기록을 확인합니다.</li>
              <li><strong>＋ 과거 이력 추가</strong>를 눌러 실제 실시일과 비고를 입력합니다.</li>
              <li>기존 이력의 <strong>수정</strong> 버튼으로 날짜·비고를 변경할 수 있습니다.</li>
              <li>잘못 등록한 이력은 <strong>삭제</strong>할 수 있습니다.</li>
            </ol>
            <div class="guide-example">예: 작업환경측정 → 2026-03-13 「상반기 측정」 / 2026-09-25 「하반기 측정」처럼 한 일정 안에 계속 누적 관리합니다.</div>
          </div>
        </details>

        <details>
          <summary><span class="guide-no">05</span>일정 수정·삭제 방법</summary>
          <div class="guide-body">
            <p>달력 또는 금주·차주 목록의 일정을 누르면 먼저 상세정보와 과거 이력이 표시됩니다. 일정 자체를 변경하려면 하단의 <strong>일정 수정</strong>을 누릅니다.</p>
            <ul>
              <li>담당부서, 날짜, 시간, 반복주기, 일정명, 내용을 수정할 수 있습니다.</li>
              <li>수정창의 <strong>삭제</strong>를 누르면 해당 일정이 삭제됩니다.</li>
              <li><strong>반복 일정 삭제는 해당 반복 일정 전체</strong>가 삭제되므로 확인문구를 반드시 확인합니다.</li>
              <li>여러 건을 한 번에 지울 때는 상단 <strong>선택 삭제</strong>를 이용합니다.</li>
            </ul>
            <div class="guide-warning"><strong>주의</strong> · 삭제 후에는 복구 기능이 없으므로 일정명과 날짜를 확인한 뒤 삭제하세요.</div>
          </div>
        </details>

        <details>
          <summary><span class="guide-no">06</span>방문업체 등록·수정 방법</summary>
          <div class="guide-body">
            <ol>
              <li>왼쪽 메뉴에서 <strong>출입·작업관리</strong>를 선택합니다.</li>
              <li>상단 <strong>＋ 방문업체 등록</strong>을 누릅니다.</li>
              <li>방문기간, 업체명, 방문인원, 방문대표자, 연락처, 담당부서, 담당자, 출입구역, 신청사유를 입력합니다.</li>
              <li>기존 등록업체의 업체명을 입력하면 저장된 대표자·연락처와 최근 방문이력을 불러올 수 있습니다.</li>
              <li>최근 방문이력에서 <strong>이전 방문내용 불러오기</strong>를 사용하면 반복 방문 시 입력을 줄일 수 있습니다.</li>
              <li>대표자·연락처를 업체 기본정보에도 바꾸려면 <strong>수정한 대표자·연락처를 업체 기본정보에도 반영</strong>을 체크합니다.</li>
            </ol>
            <p>전체 달력에서는 방문업체가 <strong>연한 녹색 박스</strong>로 표시되며, 시간 대신 신청사유·방문내용을 우선 표시합니다. 정확한 방문시간은 출입·작업관리 상세목록에서 확인합니다.</p>
          </div>
        </details>

        <details>
          <summary><span class="guide-no">07</span>유틸리티 작업 신청·수정 방법</summary>
          <div class="guide-body">
            <ol>
              <li><strong>출입·작업관리</strong>에서 <strong>＋ 유틸리티 작업신청</strong>을 누릅니다.</li>
              <li>작업명, 대상 유틸리티, 예정일, 작업시간, 작업내용, 작업장소, 담당부서, 작업담당자, 차단 여부를 입력합니다.</li>
              <li>외주작업이면 작업업체를 입력하고, 영향받는 부서가 있으면 <strong>관련 부서 협의</strong>를 선택합니다.</li>
              <li>수소·질소·CDA·DI·공조기·스크러버·흡착탑·폐수처리장·열배기·PCW·소성동 칠러 등 여러 대상을 동시에 선택할 수 있습니다.</li>
            </ol>
            <p>전체 달력에서는 유틸리티 작업이 <strong>연한 황색 박스</strong>로 표시되며, 시간 대신 작업내용을 우선 표시합니다. 작업시간·차단여부·담당자는 출입·작업관리 상세목록에서 확인합니다.</p>
          </div>
        </details>

        <details>
          <summary><span class="guide-no">08</span>출입·작업관리 화면과 색상 구분</summary>
          <div class="guide-body">
            <p>출입·작업관리 화면 상단은 <strong>주차별 일정</strong>, 그 아래는 <strong>월 현황과 월간 달력</strong>, 마지막에는 방문업체와 유틸리티 작업 상세목록 순서로 표시됩니다.</p>
            <p>월 마지막 주가 다음 달과 겹치면 다음 달 상세내용을 현재 월에 섞지 않고 <strong>「다음 달 일정 ○건 있음 →」</strong>으로 표시합니다. 누르면 해당 월로 이동합니다.</p>
            <div class="guide-color-row">
              <span class="guide-color"><i style="background:#eaf8f3;border-color:#16856f"></i>방문업체</span>
              <span class="guide-color"><i style="background:#fff5df;border-color:#c17a16"></i>유틸리티 작업</span>
              <span class="guide-color"><i style="background:#f5f8fb;border-color:#8292a4"></i>일반 일정</span>
              <span class="guide-color"><i style="background:white;border:1px dashed #1766b1"></i>자동 생성 일정</span>
            </div>
            <p>일반 일정은 담당 부서별 색을 사용하고, 방문·유틸리티는 종류 자체를 박스 색으로 구분합니다.</p>
          </div>
        </details>

        <details>
          <summary><span class="guide-no">09</span>엑셀 다운로드·일괄 등록</summary>
          <div class="guide-body">
            <p><strong>엑셀 다운로드</strong>는 현재 관리 중인 데이터를 엑셀로 내려받을 때 사용합니다.</p>
            <ul>
              <li>출입·작업관리에서는 방문업체 시트와 유틸리티작업 시트를 함께 다운로드합니다.</li>
              <li>일반 일정 엑셀 등록 시 기본 열은 담당부서, 날짜, 시간, 일정명, 내용, 반복주기, 종료시간입니다.</li>
              <li>반복주기는 <strong>한 번만 / 1주마다 / 6개월마다 / 1년마다 / 2년마다</strong>와 같이 입력합니다.</li>
              <li>엑셀 등록 후 화면과 저장상태를 반드시 확인합니다.</li>
            </ul>
          </div>
        </details>

        <details>
          <summary><span class="guide-no">10</span>공휴일 관리·접속 QR</summary>
          <div class="guide-body">
            <p>일반 달력의 <strong>공휴일 관리</strong>에서 누락된 임시공휴일이나 회사에서 별도로 표시할 날짜를 추가·수정할 수 있습니다. 기본 공휴일을 임의로 바꾸기보다 누락·추가가 필요한 경우에 사용합니다.</p>
            <p>하단 <strong>접속 QR</strong>을 누르면 휴대폰으로 바로 접속할 수 있는 QR과 운영 주소가 표시됩니다.</p>
          </div>
        </details>

        <details>
          <summary><span class="guide-no">11</span>여러 명이 동시에 사용할 때</summary>
          <div class="guide-body">
